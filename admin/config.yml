backend:
  name: git-gateway
  branch: main # या master यदि आप master ब्रांच का उपयोग कर रहे हैं

# मीडिया अपलोड के लिए ये लाइनें महत्वपूर्ण हैं
media_folder: "static/images/uploads" # अपलोड की गई फ़ाइलें आपके रेपो में कहाँ संग्रहीत हैं
public_folder: "/images/uploads" # अपलोड की गई फ़ाइलों तक पहुँचने के लिए सार्वजनिक पथ

# यह CMS में लाइव प्रीव्यू को सक्षम करेगा (वैकल्पिक, लेकिन अनुशंसित)
publish_mode: editorial_workflow

collections:
  # उत्पाद संग्रह
  - name: "products"
    label: "🛍️ Products"
    file: "data/products.json" # उत्पाद डेटा फ़ाइल कहाँ संग्रहीत होगी
    widget: "list"
    fields:
      - {label: "Icon", name: "icon", widget: "string", required: false, hint: "Example: fas fa-pills"}
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Category", name: "category", widget: "string", required: false, hint: "Example: Multivitamin & Nutritional Support"}
      - {label: "Description", name: "description", widget: "markdown", required: true}
      - {label: "Price", name: "price", widget: "string", required: true}

  # सेटिंग्स संग्रह (एकल फ़ाइल)
  - name: "settings"
    label: "⚙️ साइट सेटिंग्स"
    files:
      - label: "सामान्य सेटिंग्स"
        name: "general"
        file: "data/settings/general.yml" # एकल सेटिंग्स फ़ाइल का पथ
        fields:
          - {label: "Site Title", name: "siteTitle", widget: "string", required: true}
          - {label: "Logo", name: "logo", widget: "image", required: false, hint: "Upload your site logo. Path should be like /images/uploads/your-logo.png"}
          - {label: "Theme Color", name: "themeColor", widget: "color", default: "#6A1B9A"}
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            allow_add: true
            field: {label: "URL", name: "url", widget: "string"}

  # FAQs संग्रह
  - name: "faqs"
    label: "❓ FAQs"
    file: "data/faqs.json"
    widget: "list"
    fields:
      - {label: "Question", name: "question", widget: "string", required: true}
      - {label: "Answer", name: "answer", widget: "markdown", required: true}

  # Testimonials संग्रह
  - name: "testimonials"
    label: "💬 Testimonials Items"
    file: "data/testimonials.json"
    description: "Manage the individual testimonial entries."
    widget: "list"
    fields:
      - {label: "Stars", name: "stars", widget: "number", min: 1, max: 5, required: true}
      - {label: "Quote", name: "quote", widget: "markdown", required: true}
      - {label: "Image URL", name: "image_url", widget: "image", required: false}
      - {label: "Author Name", name: "author_name", widget: "string", required: true}
      - {label: "Author Title", name: "author_title", widget: "string", required: false}

  # Testimonials Section Title/Subtitle
  - name: "content_testimonials_section"
    label: "Section: Testimonials Title/Subtitle"
    file: "data/content_testimonials_section.json"
    description: "Manage the title and subtitle for the testimonials section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}

  # Reviews Collection
  - name: "reviews"
    label: "🌟 Reviews"
    file: "data/reviews.json"
    description: "Manage customer reviews."
    widget: "list"
    create: true
    fields:
      - {label: "Product Name (Optional)", name: "product_name", widget: "string", required: false}
      - {label: "Author Name", name: "author_name", widget: "string", required: true}
      - {label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5, step: 1, required: true}
      - {label: "Review Text", name: "review_text", widget: "markdown", required: true}
      - {label: "Date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DD"}
      - {label: "Verified Purchase?", name: "is_verified", widget: "boolean", default: false, required: false}

  # Advertisements Collection
  - name: "advertisements"
    label: "📢 Advertisements"
    file: "data/ads.json"
    description: "Manage website advertisements."
    widget: "list"
    create: true
    fields:
      - {label: "Ad Title (for CMS identification)", name: "ad_title", widget: "string", required: true}
      - {label: "Ad Image", name: "ad_image", widget: "image", required: true}
      - {label: "Ad Link URL (Optional)", name: "ad_link", widget: "string", required: false}
      - {label: "Display Location Hint", name: "display_location", widget: "string", required: false, hint: "e.g., homepage_banner, sidebar_product_page"}
      - {label: "Is Active?", name: "is_active", widget: "boolean", default: true, required: true}

  # Theme Colors Collection
  - name: "theme_colors"
    label: "🎨 Theme Colors"
    file: "data/theme_colors.json"
    description: "Manage the website's theme colors."
    fields:
      - {label: "Primary Color", name: "primary", widget: "color"}
      - {label: "Secondary Color", name: "secondary", widget: "color"}
      - {label: "Accent Color", name: "accent", widget: "color"}
      - {label: "Header Gradient End Color", name: "header_gradient_end", widget: "color"}

  # Hero Section Collection
  - name: "content_hero"
    label: "Section: Hero"
    file: "data/content_hero.json"
    description: "Manage the content of the Hero section on the homepage."
    fields:
      - {label: "Heading", name: "heading", widget: "string", required: true}
      - {label: "Paragraph", name: "paragraph", widget: "text", required: true}
      - {label: "Button 1 Text", name: "button1_text", widget: "string"}
      - {label: "Button 2 Text", name: "button2_text", widget: "string"}
      - {label: "Background Image", name: "background_image", widget: "image"}

  # About Us Section Collection
  - name: "content_about"
    label: "Section: About Us"
    file: "data/content_about.json"
    description: "Manage the content of the About Us section."
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Subtitle", name: "subtitle", widget: "string"}
      - {label: "Story Heading", name: "story_heading", widget: "string"}
      - {label: "Story Paragraph 1", name: "story_paragraph1", widget: "markdown"}
      - {label: "Story Paragraph 2", name: "story_paragraph2", widget: "markdown"}
      - {label: "Story Paragraph 3", name: "story_paragraph3", widget: "markdown"}
      - {label: "Image URL", name: "image_url", widget: "image"}
      - {label: "Image Alt Text", name: "image_alt", widget: "string"}
      - name: "values"
        label: "Our Values"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-lightbulb"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}

  # Therapeutic Areas Section Collection
  - name: "content_therapeutic_areas"
    label: "Section: Therapeutic Areas"
    file: "data/content_therapeutic_areas.json"
    description: "Manage content for the Therapeutic Areas section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - name: "areas"
        label: "Areas List"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-apple-alt"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "List Items", name: "list_items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}

  # Products Section Overview Collection
  - name: "content_products_section"
    label: "Section: Products Overview"
    file: "data/content_products_section.json"
    description: "Manage the title, subtitle, and search placeholder for the products section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - {label: "Search Placeholder", name: "search_placeholder", widget: "string"}

  # Why Choose Us Section Collection
  - name: "content_why_choose_us"
    label: "Section: Why Choose Us"
    file: "data/content_why_choose_us.json"
    description: "Manage items for the 'Why Choose Us' section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - name: "items"
        label: "Items List"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-user-md"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}

  # Featured Product Section Collection
  - name: "content_featured_product"
    label: "Section: Featured Product"
    file: "data/content_featured_product.json"
    description: "Manage the content for the Featured Product section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - {label: "Learn More Button Text", name: "learn_more_button", widget: "string"}
      - name: "layers"
        label: "Product Layers"
        widget: "list"
        fields:
          - {label: "ID", name: "id", widget: "string"}
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - {label: "Description", name: "description", widget: "markdown"}
          - name: "benefits"
            label: "Benefits List"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-brain"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

  # FAQs Section Title/Subtitle Collection
  - name: "content_faqs_section"
    label: "Section: FAQs Title/Subtitle"
    file: "data/content_faqs_section.json"
    description: "Manage the title and subtitle for the FAQs section on the homepage. (Actual FAQs are managed in the 'FAQs' collection)."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}

  # Research Pipeline Section Collection
  - name: "content_pipeline"
    label: "Section: Research Pipeline"
    file: "data/content_pipeline.json"
    description: "Manage content for the Research Pipeline section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - name: "items"
        label: "Pipeline Items"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-microscope"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Phase Class", name: "phase_class", widget: "string", hint: "CSS class for styling, e.g., phase-1, phase-2, phase-3"}
          - {label: "Phase Text", name: "phase_text", widget: "string", hint: "Example: Phase II Clinical Trials"}
          - {label: "Description", name: "description", widget: "text"}

  # Scientific Differentiation Section Collection
  - name: "content_scientific_differentiation"
    label: "Section: Scientific Differentiation"
    file: "data/content_scientific_differentiation.json"
    description: "Manage content for the Scientific Differentiation table."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - name: "table_rows"
        label: "Table Rows"
        widget: "list"
        fields:
          - {label: "Feature", name: "feature", widget: "string"}
          - {label: "Queens Care Value", name: "queens_care_value", widget: "string"}
          - {label: "Industry Standard Value", name: "industry_standard_value", widget: "string"}

  # Advisory/Commitment Section Collection
  - name: "content_advisory"
    label: "Section: Advisory/Commitment"
    file: "data/content_advisory.json"
    description: "Manage content for the Advisory/Commitment to Excellence section."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - {label: "Quote", name: "quote", widget: "text"}
      - name: "certifications"
        label: "Certifications"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-certificate"}
          - {label: "Name", name: "name", widget: "string"}

  # Contact Us Section Collection
  - name: "content_contact_us"
    label: "Section: Contact Us"
    file: "data/content_contact_us.json"
    description: "Manage content for the Contact Us section, including form details and map."
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "text"}
      - {label: "Form Heading", name: "form_heading", widget: "string"}
      - {label: "Form Button Text", name: "form_button", widget: "string"}
      - name: "details"
        label: "Contact Details"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-envelope"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Link URL", name: "link", widget: "string"}
          - {label: "Link Text", name: "link_text", widget: "string"}
          - {label: "Link Target", name: "link_target", widget: "string", hint: "Example: _blank", required: false}
      - {label: "Map Iframe Src", name: "map_iframe_src", widget: "text", hint: "Google Maps embed iframe src URL"}

  # Footer Section Collection
  - name: "content_footer"
    label: "Section: Footer"
    file: "data/content_footer.json"
    description: "Manage content for the website footer."
    fields:
      - {label: "Company Name", name: "company_name", widget: "string"}
      - {label: "Company Description", name: "company_description", widget: "text"}
      - name: "social_links"
        label: "Social Links"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fab fa-facebook-f"}
          - {label: "URL", name: "url", widget: "string"}
      - {label: "Quick Links Heading", name: "quick_links_heading", widget: "string"}
      - name: "quick_links"
        label: "Quick Links"
        widget: "list"
        fields:
          - {label: "Text", name: "text", widget: "string"}
          - {label: "URL", name: "url", widget: "string"}
      - {label: "Legal Heading", name: "legal_heading", widget: "string"}
      - name: "legal_links"
        label: "Legal Links"
        widget: "list"
        fields:
          - {label: "Text", name: "text", widget: "string"}
          - {label: "URL", name: "url", widget: "string"}
      - {label: "Contact Info Heading", name: "contact_info_heading", widget: "string"}
      - name: "contact_info_items"
        label: "Contact Info Items"
        widget: "list"
        fields:
          - {label: "Icon", name: "icon", widget: "string", hint: "Example: fas fa-map-marker-alt"}
          - {label: "Text", name: "text", widget: "string"}
      - {label: "Copyright Year", name: "copyright_year", widget: "number"}

  # WhatsApp Float Button Collection
  - name: "content_whatsapp_float"
    label: "Site: WhatsApp Float Button"
    file: "data/content_whatsapp_float.json"
    description: "Manage the WhatsApp floating button settings."
    fields:
      - {label: "URL", name: "url", widget: "string", hint: "Full WhatsApp click to chat URL"}
      - {label: "Icon", name: "icon", widget: "string", hint: "Example: fab fa-whatsapp"}

  # ब्लॉग पोस्ट संग्रह
  - name: "blog"
    label: "📝 ब्लॉग पोस्ट"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # फ़ाइल नाम उत्पन्न करता है जैसे 2024-05-30-my-post.md
    fields:
      - {label: "शीर्षक", name: "title", widget: "string", required: true}
      - {label: "प्रकाशन तिथि", name: "date", widget: "datetime", required: true, format: "YYYY-MM-DDTHH:mm:ssZ", time_format: true}
      - {label: "लेखक", name: "author", widget: "string", required: true}
      - {label: "विशेष रुप से प्रदर्शित छवि", name: "image", widget: "image", required: false, hint: "ब्लॉग पोस्ट हेडर के लिए वैकल्पिक छवि"}
      - {label: "मुख्य भाग", name: "body", widget: "markdown", required: true}
      - {label: "टैग", name: "tags", widget: "list", default: [], allow_add: true, hint: "वर्गीकरण के लिए कीवर्ड"}
      - {label: "श्रेणियाँ", name: "categories", widget: "list", default: [], allow_add: true, hint: "पोस्ट के लिए व्यापक श्रेणियाँ"}
      - {label: "ड्राफ्ट", name: "draft", widget: "boolean", default: false, hint: "सार्वजनिक साइट से छिपाने के लिए सही पर सेट करें"}

  # पेज संग्रह (स्थिर पृष्ठों जैसे हमारे बारे में, संपर्क, आदि के लिए)
  - name: "pages"
    label: "📄 पेज"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "शीर्षक", name: "title", widget: "string", required: true}
      - {label: "स्लग", name: "slug", widget: "string", required: true, hint: "पृष्ठ के लिए URL पथ (जैसे, about-us)"}
      - {label: "मुख्य भाग", name: "body", widget: "markdown", required: true}
      - {label: "टेम्पलेट", name: "template", widget: "select", options: ["default", "contact", "about"], default: "default", required: false, hint: "वैकल्पिक: एक लेआउट टेम्पलेट निर्दिष्ट करें"}
      - {label: "प्रकाशित", name: "published", widget: "boolean", default: true}
