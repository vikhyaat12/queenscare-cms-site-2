backend:
  name: git-gateway
  branch: main # Branch to publish to, usually 'main' or 'master'

media_folder: "images/uploads" # Where uploaded files will be stored
public_folder: "/images/uploads" # The public path to the media folder

collections:
  - name: "site-settings"
    label: "Site Settings"
    files:
      - label: "Global Settings"
        name: "global"
        file: "_data/site.json"
        fields:
          - label: "Site Title"
            name: "title"
            widget: "string"
          - label: "Colors"
            name: "colors"
            widget: "object"
            fields:
              - label: "Primary Color"
                name: "primary"
                widget: "color"
              - label: "Secondary Color"
                name: "secondary"
                widget: "color"
              - label: "Accent Color"
                name: "accent"
                widget: "color"
              - label: "Header Gradient End Color"
                name: "header_gradient_end"
                widget: "color"
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Heading"
                name: "heading"
                widget: "string"
              - label: "Paragraph"
                name: "paragraph"
                widget: "text"
              - label: "Button 1 Text"
                name: "button1_text"
                widget: "string"
              - label: "Button 2 Text"
                name: "button2_text"
                widget: "string"
              - label: "Background Image"
                name: "background_image"
                widget: "image"
          - label: "About Us Section"
            name: "about"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Story Heading"
                name: "story_heading"
                widget: "string"
              - label: "Story Paragraph 1"
                name: "story_paragraph1"
                widget: "markdown"
              - label: "Story Paragraph 2"
                name: "story_paragraph2"
                widget: "markdown"
              - label: "Story Paragraph 3"
                name: "story_paragraph3"
                widget: "markdown"
              - label: "About Image URL"
                name: "image_url"
                widget: "image"
              - label: "About Image Alt Text"
                name: "image_alt"
                widget: "string"
              - label: "Values"
                name: "values"
                widget: "list"
                fields:
                  - label: "Icon Class (e.g., fas fa-lightbulb)"
                    name: "icon"
                    widget: "string"
                  - label: "Heading"
                    name: "heading"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"
          - label: "Therapeutic Areas Section"
            name: "therapeutic_areas"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Areas"
                name: "areas"
                widget: "list"
                fields:
                  - label: "Icon Class (e.g., fas fa-apple-alt)"
                    name: "icon"
                    widget: "string"
                  - label: "Heading"
                    name: "heading"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"
                  - label: "List Items"
                    name: "list_items"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
          - label: "Products Section"
            name: "products_section"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Search Placeholder"
                name: "search_placeholder"
                widget: "string"
          - label: "Why Choose Us Section"
            name: "why_choose_us"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - label: "Icon Class (e.g., fas fa-user-md)"
                    name: "icon"
                    widget: "string"
                  - label: "Heading"
                    name: "heading"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"
          - label: "Featured Product Section"
            name: "featured_product"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Learn More Button Text"
                name: "learn_more_button"
                widget: "string"
              - label: "Layers"
                name: "layers"
                widget: "list"
                fields:
                  - label: "Layer ID (e.g., vitamin)"
                    name: "id"
                    widget: "string"
                  - label: "Layer Name"
                    name: "name"
                    widget: "string"
                  - label: "Title"
                    name: "title"
                    widget: "string"
                  - label: "Subtitle"
                    name: "subtitle"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"
                  - label: "Benefits"
                    name: "benefits"
                    widget: "list"
                    fields:
                      - label: "Icon Class"
                        name: "icon"
                        widget: "string"
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                      - label: "Description"
                        name: "description"
                        widget: "string"
          - label: "Testimonials Section"
            name: "testimonials"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - label: "Stars (1-5)"
                    name: "stars"
                    widget: "number"
                    min: 1
                    max: 5
                  - label: "Quote"
                    name: "quote"
                    widget: "text"
                  - label: "Author Image URL"
                    name: "image_url"
                    widget: "image"
                  - label: "Author Name"
                    name: "author_name"
                    widget: "string"
                  - label: "Author Title"
                    name: "author_title"
                    widget: "string"
          - label: "Research Pipeline Section"
            name: "pipeline"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - label: "Icon Class"
                    name: "icon"
                    widget: "string"
                  - label: "Heading"
                    name: "heading"
                    widget: "string"
                  - label: "Phase Class (e.g., phase-1, phase-2, phase-3)"
                    name: "phase_class"
                    widget: "string"
                  - label: "Phase Text (e.g., Phase I Clinical Trials)"
                    name: "phase_text"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"
          - label: "Scientific Differentiation Section"
            name: "scientific_differentiation"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Table Rows"
                name: "table_rows"
                widget: "list"
                fields:
                  - label: "Feature"
                    name: "feature"
                    widget: "string"
                  - label: "Queens Care Value"
                    name: "queens_care_value"
                    widget: "string"
                  - label: "Industry Standard Value"
                    name: "industry_standard_value"
                    widget: "string"
          - label: "Advisory Section"
            name: "advisory"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Quote"
                name: "quote"
                widget: "text"
              - label: "Certifications"
                name: "certifications"
                widget: "list"
                fields:
                  - label: "Icon Class"
                    name: "icon"
                    widget: "string"
                  - label: "Name"
                    name: "name"
                    widget: "string"
          - label: "Contact Us Section"
            name: "contact_us"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
              - label: "Form Heading"
                name: "form_heading"
                widget: "string"
              - label: "Form Button Text"
                name: "form_button"
                widget: "string"
              - label: "Contact Details"
                name: "details"
                widget: "list"
                fields:
                  - label: "Icon Class"
                    name: "icon"
                    widget: "string"
                  - label: "Heading"
                    name: "heading"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "string"
                  - label: "Link (optional)"
                    name: "link"
                    widget: "string"
                    required: false
                  - label: "Link Text (optional)"
                    name: "link_text"
                    widget: "string"
                    required: false
                  - label: "Link Target (e.g., _blank for new tab)"
                    name: "link_target"
                    widget: "string"
                    required: false
              - label: "Map Iframe Source"
                name: "map_iframe_src"
                widget: "string"
          - label: "Footer Section"
            name: "footer"
            widget: "object"
            fields:
              - label: "Company Name"
                name: "company_name"
                widget: "string"
              - label: "Company Description"
                name: "company_description"
                widget: "text"
              - label: "Social Links"
                name: "social_links"
                widget: "list"
                fields:
                  - label: "Icon Class"
                    name: "icon"
                    widget: "string"
                  - label: "URL"
                    name: "url"
                    widget: "string"
              - label: "Quick Links Heading"
                name: "quick_links_heading"
                widget: "string"
              - label: "Quick Links"
                name: "quick_links"
                widget: "list"
                fields:
                  - label: "Text"
                    name: "text"
                    widget: "string"
                  - label: "URL"
                    name: "url"
                    widget: "string"
              - label: "Legal Heading"
                name: "legal_heading"
                widget: "string"
              - label: "Legal Links"
                name: "legal_links"
                widget: "list"
                fields:
                  - label: "Text"
                    name: "text"
                    widget: "string"
                  - label: "URL"
                    name: "url"
                    widget: "string"
              - label: "Contact Info Heading"
                name: "contact_info_heading"
                widget: "string"
              - label: "Contact Info Items"
                name: "contact_info_items"
                widget: "list"
                fields:
                  - label: "Icon Class"
                    name: "icon"
                    widget: "string"
                  - label: "Text"
                    name: "text"
                    widget: "string"
              - label: "Copyright Year"
                name: "copyright_year"
                widget: "number"
          - label: "WhatsApp Floating Button"
            name: "whatsapp_float"
            widget: "object"
            fields:
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Icon Class"
                name: "icon"
                widget: "string"

  - name: "faqs"
    label: "FAQs"
    folder: "_data" # Store FAQs in the _data folder
    file: "faqs.json" # Name of the JSON file
    create: false # Do not allow creating new FAQ files, only editing the existing one
    fields:
      - label: "FAQs List"
        name: "faqs"
        widget: "list"
        fields:
          - label: "Question"
            name: "question"
            widget: "string"
          - label: "Answer"
            name: "answer"
            widget: "markdown"

  - name: "products"
    label: "Products"
    folder: "_data" # Store products in the _data folder
    file: "products.json" # Name of the JSON file
    create: false # Do not allow creating new product files, only editing the existing one
    fields:
      - label: "Products List"
        name: "products"
        widget: "list"
        fields:
          - label: "Icon Class (e.g., fas fa-pills)"
            name: "icon"
            widget: "string"
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Category"
            name: "category"
            widget: "string"
          - label: "Description"
            name: "description"
            widget: "text"
          - label: "Price (e.g., 299)"
            name: "price"
            widget: "string" # Use string for price to allow currency symbols if needed
