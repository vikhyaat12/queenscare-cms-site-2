backend:
  name: git-gateway
  branch: main # or master if you're using master branch

# These lines are crucial
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Price", name: "price", widget: "number"}
      - {label: "Image", name: "image", widget: "image"}

  - name: "settings"
    label: "Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "content/settings/general.json"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - label: "Colors"
            name: "colors"
            widget: "object"
            fields:
              - {label: "Primary Color", name: "primary", widget: "string"}
              - {label: "Secondary Color", name: "secondary", widget: "string"}
