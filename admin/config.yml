backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads" # Where uploaded files go
public_folder: "/images/uploads"

site_url: https://queenscare.co.in
logo_url: /images/logo.png

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "content/settings/general.md"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Logo Image", name: "logo", widget: "image" }

  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }

  - name: "whyus"
    label: "Why Choose Us"
    folder: "content/whyus"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Reason", name: "reason", widget: "string" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Us"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Instructions", name: "instructions", widget: "text" }
