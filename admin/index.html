<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <div id="nc-root"></div>

  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>

  <script>
    // CMS कॉन्फ़िगरेशन ऑब्जेक्ट को परिभाषित करें
    // अंतिम तत्वों के बाद कोई अतिरिक्त कॉमा नहीं है
    const cmsConfig = {
      backend: {
        name: 'git-gateway',
        branch: 'main'
      },
      media_folder: "images/uploads", // जहाँ अपलोड की गई फाइलें जाती हैं
      public_folder: "/images/uploads", // पब्लिक URL
      site_url: "http://localhost:8000", // आपकी वेबसाइट का URL - एक मान्य प्लेसहोल्डर
      logo_url: "/images/logo.png", // लोगो का URL - एक मान्य प्लेसहोल्डर

      collections: [
        {
          name: "settings",
          label: "Site Settings",
          files: [
            {
              label: "General",
              name: "general",
              file: "content/settings/general.md",
              fields: [
                { label: "Site Title", name: "title", widget: "string" },
                { label: "Tagline", name: "tagline", widget: "string" },
                { label: "Logo Image", name: "logo", widget: "image" }
              ]
            }
          ]
        },
        {
          name: "products",
          label: "Products",
          folder: "content/products",
          create: true,
          slug: "{{slug}}",
          fields: [
                { label: "Title", name: "title", widget: "string" },
                { label: "Description", name: "description", widget: "text" },
                { label: "Image", name: "image", widget: "image" }
          ]
        },
        {
          name: "whyus",
          label: "Why Choose Us",
          folder: "content/whyus",
          create: true,
          slug: "{{slug}}",
          fields: [
                { label: "Reason", name: "reason", widget: "string" }
          ]
        },
        {
          name: "testimonials",
          label: "Testimonials",
          folder: "content/testimonials",
          create: true,
          slug: "{{slug}}",
          fields: [
                { label: "Name", name: "name", widget: "string" },
                { label: "Quote", name: "quote", widget: "text" },
                { label: "Image", name: "image", widget: "image", required: false }
          ]
        },
        {
          name: "pages",
          label: "Pages",
          files: [
            {
              label: "About Us",
              name: "about",
              file: "content/pages/about.md",
              fields: [
                { label: "Heading", name: "heading", widget: "string" },
                { label: "Body", name: "body", widget: "markdown" }
              ]
            },
            {
              label: "Contact",
              name: "contact",
              file: "content/pages/contact.md",
              fields: [
                { label: "Heading", name: "heading", widget: "string" },
                { label: "Instructions", name: "instructions", widget: "text" }
              ]
            }
          ]
        }
      ]
    };

    // CMS ऑब्जेक्ट के उपलब्ध होने की प्रतीक्षा करें
    function initNetlifyCMS() {
      if (typeof CMS !== 'undefined') {
        // यदि CMS परिभाषित है, तो इसे कॉन्फ़िगरेशन के साथ शुरू करें
        CMS.init({ config: cmsConfig });
      } else {
        // यदि CMS अभी तक परिभाषित नहीं है, तो थोड़ी देर प्रतीक्षा करें और फिर से प्रयास करें
        setTimeout(initNetlifyCMS, 100); // 100 मिलीसेकंड के बाद फिर से जांचें
      }
    }

    // DOMContentLoaded इवेंट पर इनिशियलाइज़ेशन प्रक्रिया शुरू करें
    document.addEventListener('DOMContentLoaded', initNetlifyCMS);
  </script>
</body>
</html>
