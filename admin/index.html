<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Admin - Complete CMS Control</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Loading screen styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      color: white;
      transition: opacity 0.5s ease-out; /* Smooth fade out */
    }
    .loading-logo {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 1.2rem;
      opacity: 0.9;
      text-align: center;
    }
    .feature-list {
      margin-top: 2rem;
      text-align: left;
      opacity: 0.8;
    }
    .feature-list li {
      list-style: none;
      padding: 0.5rem 0;
      position: relative;
      padding-left: 2rem;
    }
    .feature-list li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #4CAF50;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="loading-screen">
    <div class="loading-logo">🚀 CMS Pro</div>
    <div class="spinner"></div>
    <div class="loading-text">
      <p>Loading Complete Website Management System...</p>
      <ul class="feature-list">
        <li>Page Editor</li>
        <li>Product Management</li>
        <li>Media Manager</li>
        <li>Theme Customizer</li>
        <li>E-commerce Ready</li>
      </ul>
    </div>
  </div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  
  <script src="https://unpkg.com/netlify-cms-app@3.0.10/dist/netlify-cms-app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Netlify CMS
      if (window.CMS) {
        window.CMS.init();
      }

      // Initialize Netlify Identity
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
        
        window.netlifyIdentity.on("logout", () => {
          document.location.href = "/";
        });
      }

      // Hide loading screen after a delay, as CMS loading can be variable
      setTimeout(() => {
        const loadingScreen = document.querySelector('.loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500); // Allow fade out transition to complete
        }
      }, 3000); // Adjust delay as needed, e.g., 3000ms = 3 seconds
    });
  </script>
</body>
</html>
